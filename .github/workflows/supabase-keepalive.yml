name: Supabase Keep-Alive

# Free-tier Supabase projects pause after 7 days of inactivity.
# This workflow writes a heartbeat row twice a week (Mon + Thu) so the
# project registers a fresh database write — read-only REST queries can
# be served from PostgREST caches and may not count as "activity" for
# Supabase's pause heuristic.
#
# Writes go into the existing rate_limits table with action='keepalive'.
# Rows are cleaned up periodically by scripts/clear-rate-limits.js.

on:
  schedule:
    - cron: '0 12 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Insert heartbeat row into Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "Missing SUPABASE_URL or SUPABASE_SERVICE_KEY secret"
            exit 1
          fi
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d '{"ip_hash":"github-actions-keepalive","action":"keepalive"}' \
            "$SUPABASE_URL/rest/v1/rate_limits")
          if [ "$status" != "201" ]; then
            echo "Supabase heartbeat insert failed (HTTP $status)"
            exit 1
          fi
          echo "Supabase heartbeat insert OK (HTTP $status)"
