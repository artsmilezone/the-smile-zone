name: Supabase Keep-Alive

# Free-tier Supabase projects pause after 7 days of inactivity.
# This workflow runs a direct Postgres write twice a week (Mon + Thu).
# psql talks straight to the database (bypasses PostgREST + RLS), so it
# is unambiguous "database activity" for Supabase's pause heuristic.
#
# Writes go into the existing rate_limits table with action='keepalive'.
# Rows are cleaned up periodically by scripts/clear-rate-limits.js.

on:
  schedule:
    - cron: '0 12 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Insert heartbeat row via psql
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "Missing SUPABASE_DB_URL secret"
            exit 1
          fi
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c \
            "INSERT INTO rate_limits (ip_hash, action) VALUES ('github-actions-keepalive', 'keepalive');"
          echo "Supabase heartbeat insert OK"
